name: Nightly regression

# Full suite is too slow and too dependent on the shared dev app to run on
# every PR. This workflow is the overnight / on-demand pack.
on:
  schedule:
    # 02:00 UTC daily. GitHub can delay cron by a few minutes.
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: regression-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  TEST_ENV: dev
  BASE_URL: ${{ secrets.DEV_BASE_URL }}
  FIRM_ADMIN_EMAIL: ${{ secrets.DEV_FIRM_ADMIN_EMAIL }}
  FIRM_ADMIN_PASSWORD: ${{ secrets.DEV_FIRM_ADMIN_PASSWORD }}

jobs:
  # Split the regression pack across two runners. --shard=1/2 and 2/2 each
  # get about half the files. fail-fast: false so one red shard still
  # uploads its blob for the merged HTML report.
  regression:
    name: Regression shard ${{ matrix.shard }}/2
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run regression shard
        run: npm run test:regression -- --project=chromium --shard=${{ matrix.shard }}/2

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report
          retention-days: 7

  # Yopmail OTP tests stay off the PR path and off the sharded regression
  # so an external inbox outage does not wipe the rest of the report.
  nightly-onboarding:
    name: Nightly onboarding
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run @nightly tests
        run: npx playwright test --project=chromium --grep @nightly --reporter=list --reporter=html

      - name: Upload onboarding report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-onboarding-report
          path: playwright-report/
          retention-days: 7

  merge-reports:
    name: Merge shard reports
    needs: regression
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download shard blobs
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge into one HTML report
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload merged HTML report
        uses: actions/upload-artifact@v4
        with:
          name: regression-html-report
          path: playwright-report/
          retention-days: 14
