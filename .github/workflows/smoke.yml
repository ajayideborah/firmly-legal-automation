name: Smoke Tests

on:
  workflow_dispatch:

  pull_request:
    branches:
      - develop
      - main

  push:
    branches:
      - develop
      - main

# A second push to the same PR cancels the in-flight run so we don't pay
# for stale jobs.
concurrency:
  group: smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  smoke:
    name: Firm Admin Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CI: true
      TEST_ENV: dev
      BASE_URL: ${{ secrets.DEV_BASE_URL }}
      FIRM_ADMIN_EMAIL: ${{ secrets.DEV_FIRM_ADMIN_EMAIL }}
      FIRM_ADMIN_PASSWORD: ${{ secrets.DEV_FIRM_ADMIN_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Playwright specs
        run: npm run validate -- --project=chromium  

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: npm run test:smoke -- --project=chromium --reporter=list --reporter=html

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-playwright-report
          path: playwright-report/
          retention-days: 7

  # One required check for branch protection. Add jobs above and list them
  # in needs: — you do not keep updating the GitHub UI.
  ci-gate:
    name: CI Gate
    needs: [lint, smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if lint or smoke did not succeed
        run: |
          echo "lint=${{ needs.lint.result }} smoke=${{ needs.smoke.result }}"
          if [ "${{ needs.lint.result }}" != "success" ] || [ "${{ needs.smoke.result }}" != "success" ]; then
            exit 1
          fi
